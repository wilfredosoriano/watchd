.err{font-size:13px;color:var(--red)}.err:empty{display:none}

.nav button.on{background:var(--fill);color:var(--on)}

.nav .div{width:1px;height:28px;background:var(--line);margin:0 4px;flex-shrink:0}

.tabs button{height:42px;border-radius:12px;font-weight:600;font-size:14px;color:var(--muted)}

.sw{-webkit-appearance:none;appearance:none;width:50px;height:30px;border-radius:15px;background:var(--track);position:relative;flex-shrink:0;margin:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}

<style>

  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); return true;
}

/* ===== Layout helpers ===== */
// Two-column pages from 768px. On phones .cols is display:contents, so the phone layout is untouched.
const wideMQ = matchMedia('(min-width:768px)');
const wide = () => wideMQ.matches;
const cols = (main, side) => `<div class="cols"><div>${main}</div><div>${side}</div></div>`;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
const isAndroid = () => /Android/.test(navigator.userAgent);
function installHint() {
  if (isIOS()) return 'In Safari, tap Share, then Add to Home Screen. Watchd opens full screen, and your library is still there when you\'re offline.';
  if (isAndroid()) return 'In Chrome, tap the ⋮ menu, then Add to Home screen or Install app. Watchd opens full screen, and your library is still there when you\'re offline.';
  return 'In Chrome or Edge, click the install icon in the address bar. Watchd opens in its own window, and your library is still there when you\'re offline.';
}

/* ===== Render ===== */
function render() {
  if (!S.name) { $('#root').innerHTML = welcome(); $('#navroot').innerHTML = ''; document.body.classList.remove('nav-on'); return; }
  const p = U.page;
  if (p === 'detail' && !U.cur) U.page = 'home';
  const views = { home, library, ask, settings, detail, shared, person, stats };
  $('#root').innerHTML = `<main class="app${p === 'ask' ? ' ask' : ''}">${(views[U.page] || home)()}</main>${U.page === 'ask' ? composer() : ''}`;
  $('#navroot').innerHTML = ['detail', 'shared', 'person', 'stats'].includes(U.page) ? '' : nav();
  document.body.classList.toggle('nav-on', !!$('#navroot').innerHTML);
  if (tour) placeTour();
  else if (U.page === 'home') maybeTour('main');
  else if (U.page === 'library' && lib().length) maybeTour('library');
  else if (U.page === 'detail' && U.cur) { const d = U.det.get(K(U.cur.type, U.cur.id)); if (d && !d.error) maybeTour('detail'); }
}

function nav() {
  const b = (id, icon, label) => `<button class="${U.page === id ? 'on' : ''}" data-a="go" data-p="${id}" aria-label="${label}"${U.page === id ? ' aria-current="page"' : ''}>${ic(icon)}<span class="t">${label}</span></button>`;
  const onAsk = U.page === 'ask';
  return `<div class="navwrap"><nav class="nav" aria-label="Main"><div class="brandmark" aria-hidden="true"><span class="mark">${LOGO(22)}</span><span>Watchd</span></div>${b('home', 'home', 'Home')}${b('library', 'bookmark', 'Library')}${b('settings', 'settings', 'Settings')}<span class="div" aria-hidden="true"></span><button class="act${onAsk ? ' on' : ''}" data-a="go" data-p="ask" aria-label="Ask for picks"${onAsk ? ' aria-current="page"' : ''}>${ic('sparkles', 22)}<span class="t">Ask</span></button></nav></div>`;
}

function welcome() {

  <div>
    <h1 class="h1" style="font-size:32px;font-weight:700;margin-bottom:8px">Watchd</h1>

function rowItem(m, right = '', extraSub = '') {
  return `<button class="li lirow" data-a="open" data-t="${m.type}" data-id="${m.id}"><span style="display:flex;gap:12px;align-items:center;min-width:0">${poster(m.poster)}<span style="min-width:0;display:flex;flex-direction:column;gap:2px"><span class="ttl clamp">${esc(m.title)}</span><span class="sub">${esc([m.year, typeName(m.type)].filter(Boolean).join(', '))}${extraSub}</span>${m.rating ? `<span class="stars" style="gap:1px" aria-label="Rated ${m.rating} out of 5">${Array.from({ length: m.rating }, () => ic('star', 12, 1)).join('')}</span>` : ''}</span></span>${right}</button>`;
}

function home() {
  const L = lib();
  const w = L.filter(x => x.status === 'watching').sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  const fin = L.filter(x => x.status === 'finished').length;
  const recent = [...L].sort((a, b) => b.addedAt - a.addedAt).slice(0, 4);
  loadTrending();
  const tr = U.trend;
  const P = {};
  P.head = `<header class="row">
    <div style="display:flex;gap:12px;align-items:center;min-width:0"><div class="av">${esc(S.name[0].toUpperCase())}</div>
      <div style="min-width:0"><div class="t15 clamp">Hello, ${esc(S.name)}</div><div class="sub">${L.length ? `${L.length} saved, ${fin} finished` : 'Your library is empty'}</div></div></div>
  </header>`;
  P.hero = `<section class="blk">
    <div class="row" style="align-items:flex-start"><div><div class="cap">Watching now</div><div class="amt">${w.length} ${w.length === 1 ? 'title' : 'titles'}</div></div>
      <button class="pill sm" data-a="seewatching">See all</button></div>
    <div class="g2" style="margin-top:18px">
      <button class="pill" data-a="search" data-tour="find">${ic('search', 18)}Find a title</button>

  P.cont = `${w.length ? `<div style="display:flex;flex-direction:column;gap:10px" data-tour="continue"><h2 class="h2">Continue watching</h2>${w.slice(0, 3).map(x => {
    const pct = x.type === 'tv' && x.total ? Math.round(x.progress / x.total * 100) : null;
    return `<button class="card row" data-a="open" data-t="${x.type}" data-id="${x.id}" style="justify-content:flex-start;gap:12px">${poster(x.poster)}<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span class="ttl clamp">${esc(x.title)}</span>${pct !== null ? `<span class="bar" style="margin-top:4px"><i style="width:${pct}%"></i></span><span class="sub">${esc(progressText(x))}</span>` : `<span class="sub">${esc([x.year, typeName(x.type)].filter(Boolean).join(', '))}</span>`}</span></button>`;
  }).join('')}</div>` : ''}`;
  P.up = upcoming();
  P.byl = becauseYouLiked();
  P.trend = `<div data-tour="trending"><h2 class="h2" style="margin-bottom:10px">Trending this week</h2>
    ${Array.isArray(tr) ? (tr.length ? `<div class="rail" data-keep="trend">${shown(tr).map(m => railCard(m)).join('')}</div>`

    : `<div class="card empty">${ic('bookmark', 22)}<div class="t15">Nothing saved yet</div><div class="sub">Find a movie or series to start your list.</div><button class="cta" data-a="search" style="height:44px;width:auto;padding:0 20px;font-size:14px">Find a title</button></div>`}`;
  if (!wide()) return P.head + P.hero + P.cont + P.up + P.byl + P.trend + P.genre + P.recent;
  return P.head + cols(P.hero + P.cont + P.trend + P.byl + P.genre, P.up + P.recent);

// Series in the library that have a new episode on the way.
function upcoming() {
  const shows = lib().filter(x => x.type === 'tv' && x.status !== 'planning').sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)).slice(0, 12);
  shows.forEach(x => loadDetail('tv', x.id));
  const list = shows.map(x => ({ x, n: U.det.get(K('tv', x.id))?.next_episode_to_air })).filter(e => e.n?.air_date && airDay(e.n.air_date) >= 0)
    .sort((a, b) => a.n.air_date.localeCompare(b.n.air_date));
  if (!list.length) return '';
  return section('New episodes coming', `<div class="card" style="padding:12px"><div class="inner">${list.map(({ x, n }) =>
    `<button class="li lirow" data-a="open" data-t="tv" data-id="${x.id}"><span style="display:flex;gap:12px;align-items:center;min-width:0">${poster(x.poster)}<span style="min-width:0;display:flex;flex-direction:column;gap:2px"><span class="ttl clamp">${esc(x.title)}</span><span class="sub clamp">Season ${n.season_number}, episode ${n.episode_number}${n.name && !/^Episode \d+$/.test(n.name) ? `: ${esc(n.name)}` : ''}</span></span></span><span class="chip ${airDay(n.air_date) <= 1 ? 'c-green' : 'c-neutral'}">${airLabel(n.air_date)}</span></button>`).join('')}</div></div>`);
}

// Recommendation rows built from the titles you rated highest.
function becauseYouLiked() {
  const L = lib();
  let seeds = L.filter(x => x.rating >= 4).sort((a, b) => b.rating - a.rating || (b.updatedAt || 0) - (a.updatedAt || 0)).slice(0, 2);
  if (!seeds.length) seeds = L.filter(x => x.status === 'finished').sort((a, b) => (b.statusAt?.finished || 0) - (a.statusAt?.finished || 0)).slice(0, 1);
  return seeds.map(sd => {
    const d = loadX(`/${sd.type}/${sd.id}/recommendations`);
    if (d === 'loading') return section(`Because you liked ${esc(sd.title)}`, SKEL);
    const list = (d.results || []).map(slimAs(sd.type)).filter(m => m && !get(m.type, m.id) && !isHidden(m.type, m.id)).slice(0, 12);
    return list.length ? section(`Because you liked ${esc(sd.title)}`, `<div class="rail" data-keep="byl-${sd.type}-${sd.id}">${list.map(m => railCard(m)).join('')}</div>`) : '';
  }).join('');
}

function genreSection() {
  const t = U.gType; loadGenres(t);
  const gs = U.genres[t], sel = U.gSel[t];
  if (sel) loadGenre(t, sel);
  const res = sel ? U.gRes.get(`${t}:${sel}`) : null;
  const tb = (v, l) => `<button class="${t === v ? 'on' : ''}" data-a="gtype" data-v="${v}" aria-pressed="${t === v}">${l}</button>`;
  return `<div style="display:flex;flex-direction:column;gap:10px" data-tour="genre">
    <h2 class="h2">Browse by genre</h2>
    <div class="tabs">${tb('movie', 'Movies')}${tb('tv', 'Series')}</div>
    ${Array.isArray(gs) ? (gs.length ? `<div class="chiprail" data-keep="gchips-${t}">${gs.map(g => `<button class="sel${g.id === sel ? ' on' : ''}" data-a="genre" data-v="${g.id}" aria-pressed="${g.id === sel}">${esc(g.name)}</button>`).join('')}</div>` : '') : ''}
    ${!Array.isArray(gs) || res === 'loading' || (sel && !res) ? SKEL
      : !gs.length || !res.length ? `<p class="sub" style="margin:0">Couldn't load titles for this genre. Check your connection and try again.</p>`
      : `<div class="rail" data-keep="grail-${t}-${sel}">${shown(res).map(m => railCard(m)).join('')}</div>`}
  </div>`;
}

const SORTS = { recent: ['Recent', (a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)], added: ['Date added', (a, b) => (b.addedAt || 0) - (a.addedAt || 0)],
  title: ['Title A to Z', (a, b) => a.title.localeCompare(b.title)], rating: ['Your rating', (a, b) => (b.rating || 0) - (a.rating || 0) || (b.updatedAt || 0) - (a.updatedAt || 0)],
  year: ['Release year', (a, b) => (b.year || '').localeCompare(a.year || '')] };
const fold = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
function libList() {
  const L = lib(), f = U.filter, q = fold(U.lq).trim();
  const list = L.filter(x => (f.t === 'all' || x.type === f.t) && (f.s === 'all' || x.status === f.s) && (!q || fold(x.title).includes(q)))
    .sort(SORTS[f.o]?.[1] || SORTS.recent[1]);
  if (list.length) return `<div class="card" style="padding:12px"><div class="inner">${list.map(x => rowItem(x, `<span class="chip ${STC[x.status]}">${ST[x.status]}</span>`, x.type === 'tv' && x.total && x.status === 'watching' ? `, ${epAt(x, x.progress) ? seLabel(epAt(x, x.progress)) : `ep ${x.progress} of ${x.total}`}` : '')).join('')}</div></div>`;
  if (q) return `<div class="card empty">${ic('search', 22)}<div class="t15">No matches for "${esc(U.lq.trim())}"</div><div class="sub">Check the spelling, or try All in the filters above.</div></div>`;
  return `<div class="card empty">${ic('bookmark', 22)}<div class="t15">${L.length ? `Nothing in ${f.s === 'all' ? 'this view' : ST[f.s]} yet` : 'No titles yet'}</div><div class="sub">${L.length ? 'Pick another filter, or add a title.' : 'Find a movie or series to start your list.'}</div><button class="cta" data-a="search" style="height:44px;width:auto;padding:0 20px;font-size:14px">Find a title</button></div>`;
}
function library() {
  const L = lib(), f = U.filter;
  const byType = L.filter(x => f.t === 'all' || x.type === f.t);
  const n = s => byType.filter(x => s === 'all' || x.status === s).length;
  const head = `<header class="row"><h1 class="h1">Library</h1><div style="display:flex;gap:8px"><button class="rb" data-a="go" data-p="stats" aria-label="Your stats" data-tour="stats">${ic('chart')}</button><button class="rb" data-a="share" aria-label="Share a list" data-tour="share">${ic('share')}</button></div></header>`;
  const controls = `${L.length ? `<div style="display:flex;gap:8px" data-tour="lsearch"><label class="search" style="flex:1;min-width:0">${ic('search', 18)}<input id="lq" type="search" placeholder="Search your library" value="${esc(U.lq)}" autocomplete="off" aria-label="Search your library"></label>
    <select class="sortsel" id="lsort" aria-label="Sort by">${Object.entries(SORTS).map(([k, [l]]) => `<option value="${k}"${f.o === k ? ' selected' : ''}>${l}</option>`).join('')}</select></div>` : ''}
  <div class="seg3" role="radiogroup" aria-label="Type" style="background:var(--card);border-radius:16px;padding:4px">
    ${[['all', 'All'], ['movie', 'Movies'], ['tv', 'Series']].map(([v, l]) => `<button role="radio" aria-checked="${f.t === v}" class="${f.t === v ? 'on' : ''}" data-a="ft" data-v="${v}">${l}</button>`).join('')}
  </div>
  <div class="chips" style="margin-top:-6px">${['all', ...ORDER].map(s => `<button class="sel${f.s === s ? ' on' : ''}" data-a="fs" data-v="${s}" aria-pressed="${f.s === s}">${s === 'all' ? 'All' : ST[s]}<span style="opacity:.6">${n(s)}</span></button>`).join('')}</div>`;
  const list = `<div id="liblist">${libList()}</div>`;
  if (!wide()) return head + controls + list;
  return head + cols(list, `<div class="card" style="display:flex;flex-direction:column;gap:14px">${controls.replace('margin-top:-6px', 'margin-top:0')}</div>`);
}

function detail() {
  const { type, id } = U.cur, it = get(type, id), d = U.det.get(K(type, id)), m = metaFor(type, id) || {};
  const ok = d && !d.error;
  const head = `<header class="row"><button class="rb ghost" data-a="back" aria-label="Back">${ic('chevL')}</button><span class="t15" style="font-weight:500">Details</span>${it ? `<button class="rb ghost" data-a="edit" aria-label="Edit">${ic('edit')}</button>` : '<span style="width:44px"></span>'}</header>`;
  if (!ok && !m.title) return head + (d && d.error
    ? `<div class="card empty"><div class="t15">Couldn't load this title</div><div class="sub">Check your connection, then go back and try again.</div></div>`
    : `<div class="sk" style="height:140px"></div><div class="sk" style="height:54px;border-radius:16px"></div><div class="sk" style="height:200px"></div>`);
  const title = ok ? (d.title || d.name) : m.title;
  const year = ok ? (d.release_date || d.first_air_date || '').slice(0, 4) : m.year;
  const facts = ok ? (type === 'movie' ? (d.runtime ? `${Math.floor(d.runtime / 60)}h ${d.runtime % 60}m` : '') : (d.number_of_seasons ? `${d.number_of_seasons} season${d.number_of_seasons > 1 ? 's' : ''}` : '')) : '';
  const P = {};
  P.top = `<div style="display:flex;gap:14px;align-items:flex-start">${poster(ok ? d.poster_path : m.poster, 'lg')}
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start"><h1 class="h2" style="font-size:20px;line-height:1.25">${esc(title)}</h1>
    <div class="sub">${esc([year, typeName(type), facts].filter(Boolean).join(', '))}</div>${it ? `<span class="chip ${STC[it.status]}">${ST[it.status]}</span>` : ''}</div></div>`;
  let out = '';
  if (it) {
    const idx = ORDER.indexOf(it.status);
    const total = it.total || (ok ? d.number_of_episodes : 0);
    const seg1 = idx === 2 ? 100 : idx === 1 ? (type === 'tv' && total ? Math.round(it.progress / total * 100) : 30) : 0;
    const dot = i => i <= idx ? `<span class="dot on">${ic('check', 12)}</span>` : '<span class="dot off"></span>';
    out += `<div data-tour="status"><div style="display:flex;align-items:center">${dot(0)}<span class="seg"><i style="width:${idx >= 1 ? 100 : 0}%"></i></span>${dot(1)}<span class="seg"><i style="width:${seg1}%"></i></span>${dot(2)}</div>
      <div class="row" style="margin-top:6px;align-items:flex-start">${ORDER.map((s, i) => `<button class="stepl" data-a="setst" data-v="${s}" aria-label="Mark as ${ST[s]}" style="align-items:${['flex-start', 'center', 'flex-end'][i]};color:${i <= idx ? 'var(--ink)' : 'var(--muted)'}"><span>${ST[s]}</span>${it.statusAt?.[s] && i <= idx ? `<span class="tiny">${fDate(it.statusAt[s])}</span>` : ''}</button>`).join('')}</div></div>`;
  } else {
    out += `<div class="g2" data-tour="add"><button class="sec" data-a="add" data-v="planning">${ic('bookmarkPlus', 18)}Add to Planning</button><button class="sec" data-a="add" data-v="finished">${ic('check', 18)}Already watched</button></div>`;
    out += isHidden(type, id)
      ? `<div class="card row" style="padding:12px 16px"><span class="sub" style="display:flex;gap:8px;align-items:center">${ic('eyeOff', 16)}Marked as not interested</span><button class="pill sm" data-a="unhide" data-t="${type}" data-id="${id}" style="background:var(--card2)">Undo</button></div>`
      : `<button class="sub" data-a="hide" style="display:flex;gap:6px;align-items:center;justify-content:center;min-height:36px;margin-top:-8px">${ic('eyeOff', 16)}Not interested</button>`;
  }

  P.status = out; out = '';
  if (ok) { const tr = trailerOf(d); out += tr ? `<button class="cta" data-a="trailer" data-v="${esc(tr.key)}">${ic('play', 18)}Watch trailer</button>` : `<p class="sub" style="text-align:center;margin:0">No trailer on TMDB for this title yet.</p>`; }
  else out += `<p class="sub" style="text-align:center;margin:0">Connect to the internet to see the trailer and full details.</p>`;
  P.trailer = out; out = '';
  if (ok) out += whereToWatch(d);
  if (ok && type === 'tv' && d.next_episode_to_air?.air_date && airDay(d.next_episode_to_air.air_date) >= 0) {
    const n = d.next_episode_to_air;
    out += `<div class="card row" style="justify-content:flex-start;gap:12px"><span class="ico">${ic('calendar', 20)}</span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span class="t15">Next episode: ${airLabel(n.air_date)}</span><span class="sub clamp">Season ${n.season_number}, episode ${n.episode_number}${n.name && !/^Episode \d+$/.test(n.name) ? `: ${esc(n.name)}` : ''}</span></span></div>`;
  }

  P.where = out; out = '';
  if (it) {
    out += `<div class="card" data-tour="rate"><div class="row"><span class="t15">Your rating</span><span class="sub">${it.rating ? `${it.rating} out of 5` : 'Not rated yet'}</span></div>
      <div class="stars" style="margin:6px 0 -6px -10px">${[1, 2, 3, 4, 5].map(n => `<button data-a="rate" data-v="${n}" aria-label="Rate ${n} out of 5" aria-pressed="${n <= it.rating}">${ic('star', 26, n <= it.rating)}</button>`).join('')}</div></div>`;
    const total = it.total || (ok ? d.number_of_episodes : 0);
    const last = epAt(it, it.progress), next = total && it.progress >= total ? null : epAt(it, it.progress + 1);
    if (type === 'tv') out += `<div class="card"><div class="row"><span style="font-weight:500">Episodes watched</span><span style="font-weight:600;font-variant-numeric:tabular-nums">${it.progress} of ${total || '?'}</span></div>
      <div class="bar" style="margin-top:10px"><i style="width:${total ? Math.round(it.progress / total * 100) : 0}%"></i></div>
      ${it.seasons?.length ? `<div class="row" style="margin-top:10px"><span class="sub">${last ? `Up to ${seLabel(last)}` : 'Not started'}</span><span class="sub">${next ? `Next: ${seLabel(next)}` : total ? 'All caught up' : ''}</span></div>` : ''}
      <div class="g2" style="margin-top:14px"><button class="sec" data-a="ep" data-v="-1"${it.progress <= 0 ? ' disabled' : ''}>${ic('minus', 18)}One less</button><button class="sec" data-a="ep" data-v="1"${total && it.progress >= total ? ' disabled' : ''}>${ic('plus', 18)}Watched one</button></div>${it.seasons?.length ? `<button class="sec" data-a="pickep" style="margin-top:10px">${ic('list', 18)}Choose episode</button>` : ''}</div>`;
  }

  P.mine = out; out = '';
  if (ok && d.overview) out += `<div class="card"><div class="t15">Story</div><p style="margin:8px 0 0;font-size:14px;line-height:1.5;color:var(--muted)">${esc(d.overview)}</p></div>`;
  const cast = ok ? uniq(d.credits?.cast || [], p => p.id).slice(0, 15) : [];
  if (cast.length) out += section('Cast', `<div class="rail" data-keep="cast">${cast.map(p => `<button class="cw" data-a="person" data-id="${p.id}">${avatar(p.profile_path)}<span class="rt" style="text-align:center">${esc(p.name)}</span>${p.character ? `<span class="tiny clamp" style="margin-top:-4px;width:100%;text-align:center">${esc(p.character)}</span>` : ''}</button>`).join('')}</div>`);
  P.story = out; out = '';
  if (ok) {
    let lang = d.original_language; try { lang = new Intl.DisplayNames(['en'], { type: 'language' }).of(d.original_language); } catch (e) {}
    const rows = [
      [type === 'movie' ? 'Released' : 'First aired', (d.release_date || d.first_air_date) ? fDate(d.release_date || d.first_air_date) : ''],
      type === 'movie' ? ['Runtime', facts] : ['Episodes', d.number_of_episodes ? `${d.number_of_episodes} in ${facts}` : ''],
      ['Genres', (d.genres || []).map(g => g.name).slice(0, 3).join(', ')],
      ['TMDB score', d.vote_count ? `${d.vote_average.toFixed(1)} of 10` : ''],
      ['Language', lang],
      type === 'tv' ? ['Show status', d.status || ''] : null,
    ].filter(r => r && r[1]);
    out += `<div class="card" style="padding:12px"><div class="sub" style="padding:4px 4px 10px;font-size:14px">Details</div><div class="inner">${rows.map(([l, v]) => `<div class="li"><span class="sub">${l}</span><span style="font-weight:600;text-align:right">${esc(v)}</span></div>`).join('')}</div></div>`;
  }
  if (it && it.history?.length) out += `<div class="card" style="padding:12px"><div class="sub" style="padding:4px 4px 6px;font-size:14px">Your history</div><div class="inner">${it.history.map(h => `<div class="tl"><div><div style="font-weight:600;font-size:14px">${fTime(h.at)}</div><div class="tiny">${fDate(h.at)}</div></div><span class="dot on">${ic('check', 12)}</span><div class="sub" style="font-size:13px;padding-top:2px">${esc(h.text)}</div></div>`).join('')}</div></div>`;
  P.facts = out;
  P.related = ok ? related(type, id, d) : '';
  if (!wide()) return head + P.top + P.status + P.trailer + P.where + P.mine + P.story + P.facts + P.related;
  return head + cols(P.top + P.status + P.trailer + P.mine + P.story, P.where + P.facts) + P.related;
}

// Bottom of the detail page: seasons or the rest of the movie series, then similar titles.
function related(type, id, d) {
  let out = '', shown = new Set([id]);
  if (type === 'tv') {
    const seasons = (d.seasons || []).filter(x => x.season_number > 0);
    if (seasons.length > 1 || (seasons[0] && d.next_episode_to_air)) out += section('Seasons', `<div class="rail" data-keep="seasons">${seasons.map(x => {
      const soon = x.air_date && airDay(x.air_date) > 0, yr = (x.air_date || '').slice(0, 4);
      const sub = soon ? `Coming ${fDate(x.air_date + 'T00:00:00')}` : !x.air_date ? 'Announced' : [yr, x.episode_count ? `${x.episode_count} episodes` : ''].filter(Boolean).join(', ');
      return `<div class="rc">${poster(x.poster_path || d.poster_path, 'rl')}<span class="rt">${esc(x.name || `Season ${x.season_number}`)}</span><span class="tiny" style="margin-top:-4px">${esc(sub)}</span></div>`;
    }).join('')}</div>`);
  } else if (d.belongs_to_collection) {
    const c = d.belongs_to_collection, col = loadX(`/collection/${c.id}`);
    if (col === 'loading') out += section(esc(c.name), SKEL);
    else if (!col.error) {
      const parts = (col.parts || []).map(slimAs('movie')).filter(Boolean)
        .sort((a, b) => (a.year || '9999').localeCompare(b.year || '9999'));
      parts.forEach(m => shown.add(m.id));
      if (parts.length > 1) out += section(esc(col.name || c.name), `<div class="rail" data-keep="col-${c.id}">${parts.map(m => railCard(m, m.id === id ? 'Viewing now' : (m.year || 'Coming soon'), m.id === id)).join('')}</div>`);
    }
  }
  const more = [...(d.recommendations?.results || []), ...(d.similar?.results || [])].map(slimAs(type)).filter(m => m && !shown.has(m.id) && !isHidden(type, m.id));
  const list = uniq(more, m => m.id).slice(0, 15);
  if (list.length) out += section(type === 'tv' ? 'More series like this' : 'More movies like this', `<div class="rail" data-keep="more">${list.map(m => railCard(m)).join('')}</div>`);
  return out;
}

function whereToWatch(d) {
  const rc = region(), r = d['watch/providers']?.results?.[rc];
  const out = d.release_date ? airDay(d.release_date) : null;
  const groups = r ? [['Stream', r.flatrate], ['Free', [...(r.free || []), ...(r.ads || [])]], ['Rent', r.rent], ['Buy', r.buy]].filter(g => g[1]?.length) : [];
  const logo = p => `<img src="${IMGB}w92${esc(p.logo_path)}" alt="${esc(p.provider_name)}" title="${esc(p.provider_name)}" loading="lazy">`;
  return `<div class="card" data-tour="where"><div class="row"><span class="t15">Where to watch</span><button class="sub" data-a="go" data-p="settings" style="min-height:32px;display:flex;gap:4px;align-items:center">${ic('globe', 14)}${esc(countryName(rc))}</button></div>
    ${groups.length ? groups.map(([l, ps]) => `<div style="margin-top:12px"><div class="tiny" style="margin-bottom:6px">${l}</div><div class="prov">${uniq(ps, p => p.provider_id).slice(0, 8).map(logo).join('')}</div></div>`).join('')
      : `<p class="sub" style="margin:8px 0 0">${out !== null && out > 0 ? `Not released yet. It comes out ${fDate(d.release_date + 'T00:00:00')}, and streaming usually follows a few weeks to a few months after that.`
        : out !== null && out > -120 ? `Still in cinemas. It isn't on a streaming service in ${esc(countryName(rc))} yet. New films usually arrive one to three months after release.`
        : `Not on any streaming service in ${esc(countryName(rc))} right now. Try another country in Settings, or check back later.`}</p>`}
    ${r?.link ? `<a href="${esc(r.link)}" target="_blank" rel="noopener" class="sub" style="display:inline-block;margin-top:12px;color:var(--ink);font-weight:500">See prices and links</a>` : ''}
    <p class="tiny" style="margin:8px 0 0">Streaming data from JustWatch.</p></div>`;
}

function stats() {
  const head = `<header class="row"><button class="rb ghost" data-a="back" aria-label="Back">${ic('chevL')}</button><span class="t15" style="font-weight:500">Your stats</span><span style="width:44px"></span></header>`;
  const seen = lib().filter(x => x.status !== 'planning');
  if (!seen.length) return head + `<div class="card empty">${ic('chart', 22)}<div class="t15">No stats yet</div><div class="sub">Mark titles as Watching or Finished and your stats show up here.</div></div>`;
  // Fill in runtime and genres for titles saved before the app kept them, a few at a time.
  const missing = seen.filter(x => (!x.genres || !x.runtime) && !U.det.has(K(x.type, x.id)));
  const busy = [...U.det.values()].filter(v => v === null).length;
  missing.slice(0, Math.max(0, 6 - busy)).forEach(x => loadDetail(x.type, x.id));
  const left = seen.filter(x => (!x.genres || !x.runtime) && !U.det.get(K(x.type, x.id))).length;
  // A finished series counts every episode, even if the episode counter was never used.
  const epsOf = x => x.type !== 'tv' ? 0 : x.status === 'finished' ? Math.max(x.progress || 0, x.total || 0) : x.progress || 0;
  const mins = x => x.type === 'movie' ? (x.status === 'finished' ? x.runtime || 0 : 0) : epsOf(x) * (x.runtime || 0);
  const total = seen.reduce((a, x) => a + mins(x), 0);
  const fin = seen.filter(x => x.status === 'finished'), eps = seen.reduce((a, x) => a + epsOf(x), 0);
  const rated = lib().filter(x => x.rating), avg = rated.length ? rated.reduce((a, x) => a + x.rating, 0) / rated.length : 0;
  const count = list => { const c = {}; list.forEach(x => (x.genres || []).forEach(g => c[g] = (c[g] || 0) + 1)); return Object.entries(c).sort((a, b) => b[1] - a[1]); };
  const top = count(seen).slice(0, 5);
  const hrs = m => m >= 60 ? `${Math.round(m / 60).toLocaleString()} ${Math.round(m / 60) === 1 ? 'hour' : 'hours'}` : `${m} min`;
  // Your year: titles finished this calendar year.
  const yr = new Date().getFullYear(), inYr = fin.filter(x => new Date(x.statusAt?.finished || 0).getFullYear() === yr);
  const yTop = count(inYr)[0]?.[0], best = [...inYr].filter(x => x.rating).sort((a, b) => b.rating - a.rating || (b.statusAt.finished - a.statusAt.finished))[0];
  const months = {}; inYr.forEach(x => { const m = new Date(x.statusAt.finished).toLocaleDateString('en-US', { month: 'long' }); months[m] = (months[m] || 0) + 1; });
  const busiest = Object.entries(months).sort((a, b) => b[1] - a[1])[0];
  const yMins = inYr.reduce((a, x) => a + mins(x), 0);
  U.yearText = inYr.length ? `My ${yr} on Watchd: ${inYr.length} ${inYr.length === 1 ? 'title' : 'titles'} finished (${inYr.filter(x => x.type === 'movie').length} movies, ${inYr.filter(x => x.type === 'tv').length} series)${yMins ? `, about ${hrs(yMins)} of watching` : ''}.${yTop ? ` Top genre: ${yTop}.` : ''}${best ? ` Favorite: ${best.title} (${best.rating}/5).` : ''}` : '';
  const stat = (v, l) => `<div class="stat"><b>${v}</b><span class="sub">${l}</span></div>`;
  return head + `<div class="cols"><div><section class="blk"><div class="cap">Total time watched</div><div class="amt">${hrs(total)}</div><div class="cap" style="margin-top:4px">${fin.filter(x => x.type === 'movie').length} movies finished, ${eps.toLocaleString()} episodes watched</div></section>
  <div class="g2">${stat(fin.length, 'Finished')}${stat(seen.filter(x => x.status === 'watching').length, 'Watching now')}${stat(lib().filter(x => x.status === 'planning').length, 'Planning')}${stat(avg ? avg.toFixed(1) : '–', rated.length ? `Average rating (${rated.length} rated)` : 'Average rating')}</div>
  ${top.length ? `<div class="card"><div class="t15">Top genres</div><div style="display:flex;flex-direction:column;gap:12px;margin-top:14px">${top.map(([g, c]) => `<div><div class="row" style="font-size:14px"><span>${esc(g)}</span><span class="sub">${c} ${c === 1 ? 'title' : 'titles'}</span></div><div class="bar" style="margin-top:6px"><i style="width:${Math.round(c / top[0][1] * 100)}%"></i></div></div>`).join('')}</div></div>` : ''}
  </div><div>
  <div class="card" style="padding:12px"><div class="row" style="padding:4px 4px 10px"><span class="t15">Your ${yr}</span><span class="sub">${inYr.length} finished</span></div>
    ${inYr.length ? `<div class="inner">${[
      ['Movies finished', inYr.filter(x => x.type === 'movie').length], ['Series finished', inYr.filter(x => x.type === 'tv').length],
      ['Time watched', yMins ? `About ${hrs(yMins)}` : ''], ['Top genre', yTop || ''], ['Highest rated', best ? `${best.title}, ${best.rating}/5` : ''],
      ['Busiest month', busiest ? `${busiest[0]}, ${busiest[1]} finished` : ''],
    ].filter(r => r[1] !== '').map(([l, v]) => `<div class="li"><span class="sub">${l}</span><span style="font-weight:600;text-align:right;min-width:0" class="clamp">${esc(v)}</span></div>`).join('')}</div>`
      : `<p class="sub" style="margin:0 4px 4px">Nothing finished in ${yr} yet. Mark a title as Finished and it counts here.</p>`}
  </div>
  ${inYr.length ? `<button class="cta" data-a="shareyear">${ic('share', 18)}Share my ${yr}</button>` : ''}
  <p class="tiny" style="margin:0;text-align:center">${left ? `Updating with details from TMDB, ${left} ${left === 1 ? 'title' : 'titles'} left.` : 'Times are estimates from TMDB runtimes and the episodes you marked as watched.'}</p></div></div>`;
}

function person() {
  const id = U.cur.id, d = loadX(`/person/${id}`, { append_to_response: 'combined_credits' });
  const head = `<header class="row"><button class="rb ghost" data-a="back" aria-label="Back">${ic('chevL')}</button><span class="t15" style="font-weight:500">Person</span><span style="width:44px"></span></header>`;
  if (d === 'loading') return head + `<div class="sk" style="height:120px"></div>${SKEL}<div class="sk" style="height:200px"></div>`;
  if (d.error) return head + `<div class="card empty"><div class="t15">Couldn't load this person</div><div class="sub">Check your connection, then go back and try again.</div></div>`;
  const cc = d.combined_credits || {}, acting = (d.known_for_department || 'Acting') === 'Acting';
  const raw = acting ? cc.cast || [] : (cc.crew || []).filter(x => x.department === d.known_for_department);
  // Talk and news shows swamp an actor's credits, so leave them out.
  const credits = uniq(raw.filter(x => !(x.genre_ids || []).some(g => g === 10767 || g === 10763)), x => `${x.media_type}:${x.id}`);
  const known = [...credits].sort((a, b) => (b.vote_count || 0) - (a.vote_count || 0)).slice(0, 15).map(slimRes).filter(Boolean);
  const all = [...credits].sort((a, b) => (b.release_date || b.first_air_date || '').localeCompare(a.release_date || a.first_air_date || '')).slice(0, 60);
  const born = [d.birthday ? `Born ${fDate(d.birthday + 'T00:00:00')}` : '', d.place_of_birth || ''].filter(Boolean).join(', ');
  let out = `<div style="display:flex;gap:16px;align-items:center">${avatar(d.profile_path, 'lg')}<div style="min-width:0;display:flex;flex-direction:column;gap:4px"><h1 class="h2" style="font-size:20px;line-height:1.25">${esc(d.name)}</h1><div class="sub">${esc(d.known_for_department || '')}</div>${born ? `<div class="tiny">${esc(born)}</div>` : ''}</div></div>`;
  if (d.biography) out += `<div class="card"><div class="t15">About</div><p class="bio${U.bioOpen ? '' : ' short'}" style="margin-top:8px">${esc(d.biography)}</p>${d.biography.length > 320 ? `<button class="sub" data-a="bio" style="margin-top:8px;color:var(--ink);font-weight:500;min-height:32px">${U.bioOpen ? 'Show less' : 'Read more'}</button>` : ''}</div>`;
  if (known.length) out += section('Known for', `<div class="rail" data-keep="known">${known.map(m => railCard(m)).join('')}</div>`);
  const side = all.length ? section('All titles', `<div class="card" style="padding:12px"><div class="inner">${all.map(x => { const m = slimRes(x); if (!m) return ''; const role = x.character || x.job; return rowItem(m, '', role ? `, ${esc(role)}` : ''); }).join('')}</div></div>`) : '';
  return head + cols(out, side);
}

function ask() {
  const sugg = ['Movies like Interstellar', 'A feel-good comedy series', 'Korean thrillers from the last five years', 'What should I watch next based on my library?'];
  const head = `<header class="row"><h1 class="h1">Ask</h1>${S.chat.length ? `<button class="rb" data-a="clearchat" data-v="chat" aria-label="Clear chat">${ic('refresh')}</button>` : ''}</header>`;
  const note = `<p class="sub" style="margin:-10px 0 0">Picks come only from TMDB's catalog and take your library into account.</p>`;
  const tryCard = `<div class="card"><div class="t15">Try asking</div><div class="chips" style="margin-top:12px">${sugg.map(s => `<button class="sel" data-a="suggest" data-v="${esc(s)}" style="height:auto;min-height:38px;padding:8px 14px;text-align:left">${esc(s)}</button>`).join('')}</div></div>`;
  const thread = `<div class="thread">${S.chat.map(m => {
    if (m.role === 'user') return `<div class="msg me">${esc(m.text)}</div>`;
    (m.picks || []).forEach(p => U.metas.set(K(p.type, p.id), p));
    return `<div class="msg ai"${m.err ? ' style="color:var(--muted)"' : ''}>${esc(m.text)}</div>${m.picks?.length ? `<div class="card" style="padding:12px"><div class="inner">${shown(m.picks).map(p => pickRow(p)).join('')}</div></div>` : ''}`;
  }).join('')}${U.busy ? '<div class="msg ai" style="color:var(--muted)">Looking through TMDB…</div>' : ''}</div>`;
  if (!wide()) return head + note + (S.chat.length ? '' : tryCard) + thread;
  const main = S.chat.length || U.busy ? thread : `<div class="card empty">${ic('sparkles', 22)}<div class="t15">Ask for picks</div><div class="sub">Describe what you feel like watching, or start with one of the ideas on the right.</div></div>`;
  return head + cols(main, tryCard + note.replace('margin:-10px 0 0', 'margin:0 4px'));
}
function pickRow(p) {

/* ===== Import from Letterboxd and IMDb ===== */
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.replace(/^﻿/, '').trim());
  return rows.filter(r => r.some(x => x.trim())).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()])));
}

  for (const file of files) {

      const list = !h.includes('Your Rating');
      for (const r of rows) {

        const r10 = +r['Your Rating'] || 0;

      }

      const list = /watchlist/.test(name);

        if (!r.Name) continue; const lb = parseFloat(r.Rating) || 0;
        put('lb:' + r.Name.toLowerCase() + '|' + r.Year, { name: r.Name, year: r.Year, status: list ? 'planning' : 'finished', rating: lb ? Math.max(1, Math.round(lb)) : 0, at: Date.parse(r['Watched Date'] || r.Date || '') || 0 });

  sheet(`${sheetHead(`Importing from ${kind}`)}<p class="sub" id="imp-txt" style="margin:0">Matching titles on TMDB, 0 of ${todo.length}…</p><div class="bar"><i id="imp-bar" style="width:0%"></i></div><p class="tiny" style="margin:0">Keep Watchd open until this finishes.</p>`);
  U.onClose = () => { stop = true; };
  const match = async v => {
    if (v.imdb) {
      const d = await api(`/find/${v.imdb}`, { external_source: 'imdb_id' });
      const m = d.movie_results?.[0] ? slimAs('movie')(d.movie_results[0]) : d.tv_results?.[0] ? slimAs('tv')(d.tv_results[0]) : null;
      return m;
    }

    if (!hit) { d = await api('/search/movie', { query: v.name }); hit = (d.results || []).find(x => Math.abs((+(x.release_date || '').slice(0, 4)) - +v.year) <= 1); }

  sheet(`${sheetHead('Import finished')}<div class="g2">${[[added, 'Added'], [updated, 'Updated']].map(([n, l]) => `<div class="stat" style="background:var(--card)"><b>${n}</b><span class="sub">${l}</span></div>`).join('')}</div>
    <p class="sub" style="margin:0">${found.length - added - updated ? `${found.length - added - updated} were already in your library. ` : ''}${missed.length ? `${missed.length} couldn't be matched on TMDB:` : 'Every title was matched.'}</p>
    ${missed.length ? `<div class="inner" style="background:var(--card);max-height:240px;overflow:auto">${missed.slice(0, 100).map(v => `<div class="li"><span class="clamp">${esc(v.name || v.imdb)}</span><span class="sub">${esc(v.year || '')}</span></div>`).join('')}</div>` : ''}
    <button class="cta" data-a="close">Done</button>`);
}

/* ===== Google sign-in and sync (Firebase) ===== */
let fb = null;
const loadScript = src => new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = bad; document.head.append(s); });
async function loadFB() {
  if (fb) return fb; if (!FB.apiKey) return null;
  const v = '10.12.2';
  for (const m of ['app', 'auth', 'firestore']) await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-${m}-compat.js`);
  // On the live site, sign-in runs through this domain (vercel.json forwards /__/auth to Firebase).
  // Browsers that block third-party storage, including iPhone Home Screen apps, need that to finish sign-in.
  const local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  firebase.initializeApp({ ...FB, authDomain: local ? FB.authDomain : location.host });
  fb = { auth: firebase.auth(), db: firebase.firestore() };
  fb.auth.getRedirectResult().catch(e => toast(signInError(e))).finally(() => { if (authPending()) { authPending(false); setSigning(false); } });
  fb.auth.onAuthStateChanged(onUser);
  return fb;
}
const signInError = e => /unauthorized-domain/.test(e.code || '') ? "This site isn't on Firebase's list of authorized domains yet."
  : /network-request-failed/.test(e.code || '') ? "You're offline. Connect to sign in." : "Sign-in didn't finish. Try again.";
// Set while Google sends you away and back (redirect sign-in), so the app finishes signing in when it reopens.
const authPending = v => { try { if (v === undefined) return localStorage.getItem('watchd-auth') === '1'; v ? localStorage.setItem('watchd-auth', '1') : localStorage.removeItem('watchd-auth'); } catch (e) {} };
function setSigning(v) { U.signing = v; document.querySelectorAll('[data-a="google"]').forEach(b => { b.disabled = v; b.lastChild.textContent = v ? 'Signing in…' : 'Continue with Google'; }); }
async function signIn() {
  if (U.signing) return;
  setSigning(true);
  let f; try { f = await loadFB(); } catch (e) { setSigning(false); return toast("You're offline. Connect to sign in."); }
  if (!f) { setSigning(false); return toast("Google sign-in isn't connected yet. Add your Firebase settings to turn it on."); }
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  // Home Screen apps can't open popups reliably, so they go to Google and come back instead.
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const redirect = () => { authPending(true); return f.auth.signInWithRedirect(provider); };
  try { if (standalone) return await redirect(); await f.auth.signInWithPopup(provider); }
  catch (e) {
    if (/popup-blocked|operation-not-supported/.test(e.code || '')) { try { return await redirect(); } catch (e2) { e = e2; authPending(false); } }
    if (!/popup-closed|cancelled-popup/.test(e.code || '')) toast(signInError(e));
    setSigning(false);
  }
}
// Newest change wins, per title and per hidden entry. Returns true if anything on this device changed.
function mergeCloud(c) {
  let ch = false;
  for (const [k, v] of Object.entries(c.items || {})) { const l = S.items[k]; if (!l || (v.updatedAt || 0) > (l.updatedAt || 0)) { S.items[k] = v; ch = true; } }
  for (const [k, v] of Object.entries(c.hidden || {})) { const l = S.hidden[k]; if (!l || (v.at || 0) > (l.at || 0)) { S.hidden[k] = v; ch = true; } }
  return ch;
}
let unsub = null;
async function onUser(u) {
  const fresh = U.signing || authPending();
  U.user = u;
  if (u) {
    const wasNew = !S.name;
    S.signedIn = true; if (!S.name) S.name = (u.displayName || '').split(' ')[0] || 'Friend';
    U.signing = false; authPending(false); U.sync = 'syncing';
    if (!wasNew) render();
    if (fresh) toast(`Signed in as ${u.email || u.displayName || 'your Google account'}`);
    const ref = fb.db.collection('users').doc(u.uid);
    try { const snap = await ref.get(); if (snap.exists) { const c = snap.data(); mergeCloud(c); if (wasNew && c.name) S.name = c.name; } } catch (e) {}
    persist(); push();
    // Live sync: pick up changes made on your other devices while the app is open.
    unsub?.(); unsub = ref.onSnapshot(snap => {
      if (snap.metadata.hasPendingWrites || !snap.exists) return;
      if (mergeCloud(snap.data())) { persist(); if (!$('.scrim') && !['ask'].includes(U.page) && document.activeElement?.tagName !== 'INPUT') keepRender(); }
    }, () => {});
    if (wasNew) { if (U.pending) { const p = U.pending; U.pending = null; return openShared(p); } U.page = 'home'; }
  }
  else { unsub?.(); unsub = null; }
  render();
}
function setSync(st) { U.sync = st; const el = $('#syncstatus'); if (el) el.textContent = syncLabel(); }
let syncT; function queueSync() { if (!U.user || !fb) return; setSync('syncing'); clearTimeout(syncT); syncT = setTimeout(push, 1200); }
addEventListener('online', () => setSync(U.sync)); addEventListener('offline', () => setSync(U.sync));
// Firestore resolves the write once the server has it, so "Up to date" means it really reached the cloud.
let pushN = 0;
function push() {
  if (!U.user || !fb) return; const n = ++pushN; setSync('syncing');
  fb.db.collection('users').doc(U.user.uid).set(JSON.parse(JSON.stringify({ name: S.name, items: S.items, hidden: S.hidden || {}, updatedAt: Date.now() })))
    .then(() => { if (n === pushN) setSync('ok'); }).catch(() => { if (n === pushN) setSync('error'); });
}

/* ===== Actions ===== */

    render();
  },
  google: signIn,
  signout() { fb?.auth.signOut(); U.user = null; U.sync = null; S.signedIn = false; persist(); render(); toast('Signed out'); },

  },
  unhide(d) { unhideKey(K(d.t, +d.id)); persist(); if ($('.scrim')) A.hiddenlist(); render(); },
  hiddenlist() {
    const list = hiddenList();
    sheet(`${sheetHead('Not interested')}<p class="sub" style="margin:-6px 0 0">These titles stay out of Trending, genre rows, recommendations and Ask.</p>${list.length
      ? `<div class="inner" style="background:var(--card)">${list.map(m => `<div class="li"><span style="display:flex;gap:12px;align-items:center;min-width:0">${poster(m.poster)}<span style="min-width:0"><span class="ttl clamp" style="display:block">${esc(m.title)}</span><span class="sub">${esc([m.year, typeName(m.type)].filter(Boolean).join(', '))}</span></span></span><button class="pill sm" data-a="unhide" data-t="${m.type}" data-id="${m.id}" style="background:var(--card2)">Show again</button></div>`).join('')}</div>`
      : `<div class="card empty"><div class="t15">Nothing hidden</div><div class="sub">Tap Not interested on a title's page to hide it.</div></div>`}`);
  },
  async shareyear() {
    const text = U.yearText; if (!text) return;
    const url = location.origin + '/';
    if (navigator.share) { try { await navigator.share({ text, url }); return; } catch (e) { if (e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(`${text} ${url}`); toast('Copied. Paste it anywhere to share.'); } catch (e) { toast("Couldn't share from this browser."); }
  },
  bio() { U.bioOpen = !U.bioOpen; keepRender(); },
  gtype(d) { U.gType = d.v; keepRender(); },
  genre(d) { U.gSel[U.gType] = +d.v; keepRender(); },
  ft(d) { U.filter.t = d.v; render(); },
  quickadd(d, b) {
    const t = d.t, id = +d.id;
    if (get(t, id)) return toast('Already in your library');
    const m = metaFor(t, id); if (!m) return;
    add(m, 'planning'); b.innerHTML = ic('check', 18); b.setAttribute('aria-label', 'In your library');
  },
  add(d) { const { type, id } = U.cur; const m = metaFor(type, id); if (!m) return; add(m, d.v); render(); },
  setst(d) { const it = get(U.cur.type, U.cur.id); if (!it || it.status === d.v) return; setStatus(it, d.v); toast(`Moved to ${ST[d.v]}`); render(); },
  rate(d) { const it = get(U.cur.type, U.cur.id); if (!it) return; const n = +d.v; it.rating = it.rating === n ? 0 : n; log(it, it.rating ? `Rated ${n} out of 5` : 'Rating cleared'); persist(); render(); },
  ep(d) {
    const it = get(U.cur.type, U.cur.id); if (!it) return;
    const total = it.total || 0; const p = Math.max(0, Math.min(total || 9999, it.progress + (+d.v)));
    if (p === it.progress) return; it.progress = p;
    if (p > 0 && it.status === 'planning') setStatus(it, 'watching');
    const h = it.history?.[0];
    const txt = epAt(it, p) ? `Watched ${seLabel(epAt(it, p))}` : `Watched episode ${p}`;
    if (h && /^Watched (episode|S\d)/.test(h.text) && Date.now() - h.at < 12 * 3600e3) { h.text = txt; h.at = Date.now(); it.updatedAt = Date.now(); } else if (+d.v > 0) log(it, txt);
    if (total && p === total && it.status !== 'finished') { setStatus(it, 'finished'); toast('Marked as finished'); }
    persist(); render();
  },
  pickep(d) {
    const it = get(U.cur.type, U.cur.id); if (!it?.seasons?.length) return;
    const cur = epAt(it, Math.min(it.progress + 1, it.total || it.progress + 1)) || epAt(it, it.progress) || { s: it.seasons[0][0] };
    const s = d?.v ? +d.v : cur.s, size = (it.seasons.find(([n]) => n === s) || [, 0])[1];
    sheet(`${sheetHead('Where are you up to?')}<p class="sub" style="margin:-6px 0 0">Tap the last episode you watched.</p>
      <div class="chiprail">${it.seasons.map(([n]) => `<button class="sel${n === s ? ' on' : ''}" data-a="pickep" data-v="${n}" aria-pressed="${n === s}">Season ${n}</button>`).join('')}</div>
      <div class="epgrid">${Array.from({ length: size }, (_, i) => { const idx = epIndex(it, s, i + 1), seen = idx <= it.progress;
        return `<button class="sel${seen ? ' on' : ''}" data-a="setep" data-v="${idx}" aria-label="Season ${s}, episode ${i + 1}${seen ? ', watched' : ''}">${i + 1}</button>`; }).join('')}</div>
      <button class="sec" data-a="setep" data-v="0">Not started yet</button>`);
    $('.chiprail .on')?.scrollIntoView({ inline: 'center', block: 'nearest' });
  },
  setep(d) {
    const it = get(U.cur.type, U.cur.id); if (!it) return;
    const p = Math.max(0, Math.min(it.total || 99999, +d.v)); it.progress = p;
    if (p > 0 && it.status === 'planning') setStatus(it, 'watching');
    log(it, p ? `Watched up to ${seLabel(epAt(it, p))}` : 'Episode progress cleared');
    if (it.total && p === it.total && it.status !== 'finished') { setStatus(it, 'finished'); toast('Marked as finished'); } else toast(p ? `Up to ${seLabel(epAt(it, p))}` : 'Progress cleared');
    persist(); closeSheet(); render();
  },
  trailer(d) { sheet(`${sheetHead('Trailer')}<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(d.v)}?autoplay=1&playsinline=1&rel=0" title="Trailer" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`); },
  edit() {
    const it = get(U.cur.type, U.cur.id); if (!it) return; U.editSel = it.status;
    sheet(`${sheetHead('Edit')}<div><span class="lbl">Status</span><div class="chips">${ORDER.map(s => `<button class="sel${s === it.status ? ' on' : ''}" data-a="editst" data-v="${s}" aria-pressed="${s === it.status}">${ST[s]}</button>`).join('')}</div></div>
      <button class="cta" data-a="editsave">Save changes</button><button class="sec danger" data-a="removeit">${ic('trash', 18)}Remove from library</button>`);
  },
  editst(d) { U.editSel = d.v; document.querySelectorAll('[data-a="editst"]').forEach(b => { const on = b.dataset.v === d.v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); },
  editsave() { const it = get(U.cur.type, U.cur.id); if (it && U.editSel !== it.status) setStatus(it, U.editSel); closeSheet(); render(); toast('Changes saved'); },
  removeit() { const it = get(U.cur.type, U.cur.id); confirmSheet('Remove this title?', 'Its rating, progress and history will be deleted too.', 'Remove from library', () => { removeItem(it); render(); toast('Removed from library'); }); },
  editname() { sheet(`${sheetHead('Your name')}<div><label class="lbl" for="nm">Name</label><input class="field" id="nm" maxlength="40" value="${esc(S.name)}" autocomplete="given-name"></div><div class="err" id="nm-err"></div><button class="cta" data-a="savename">Save name</button>`); },
  savename() { const v = $('#nm').value.trim(); if (!v) { $('#nm-err').textContent = 'Enter a name'; return; } S.name = v; persist(); closeSheet(); render(); toast('Name saved'); },
  theme(d) { S.theme = d.v; applyTheme(d.v); persist(); render(); },
  clearchat(d) { if (!S.chat.length) return toast('Nothing to clear yet'); S.chat = []; persist(); render(); toast(d.v === 'settings' ? 'Ask history cleared' : 'Chat cleared'); },
  async backup() {
    const ok = await saveFile(`watchd-backup-${today()}.json`, JSON.stringify({ app: 'watchd', kind: 'backup', v: 1, savedAt: new Date().toISOString(), data: { name: S.name, theme: S.theme, items: S.items, chat: S.chat } }, null, 2), 'application/json');
    if (ok) toast('Backup saved');
  },
  tipsagain() { endTour(true); S.tips = {}; persist(); go('home'); },
  erase() {
    confirmSheet('Erase all data?', "This deletes your library, ratings, history and chat from this device. It can't be undone.", 'Erase all data', () => {
      if (U.user) fb?.auth.signOut();
      endTour(true); localStorage.removeItem(KEY); S = blank(); applyTheme('auto');
      Object.assign(U, { page: 'home', stack: [], cur: null, user: null, shared: null, draft: '', filter: { s: 'all', t: 'all', o: 'recent' } });
      render(); scrollTo(0, 0); toast('All data erased');
    });
  },
  suggest(d) { send(d.v); },
  send() { send($('#ask-in')?.value); },
  share() { U.shareSel = U.filter.s; openShare(); },
  sharesel(d) { U.shareSel = d.v; document.querySelectorAll('[data-a="sharesel"]').forEach(b => { const on = b.dataset.v === d.v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); $('#lname').placeholder = defaultListName(d.v); $('#sh-err').textContent = ''; },
  async sharelink() {
    const rows = myRows(U.shareSel);
    if (!rows.length) { $('#sh-err').textContent = 'Nothing to share in this list yet. Pick another one.'; return; }
    const name = listName();
    const url = `${location.origin}/#list=${b64e(JSON.stringify({ v: 1, n: name, by: S.name, i: rows.map(r => (r.type === 'tv' ? 't' : 'm') + r.id + r.status[0]) }))}`;
    if (navigator.share) { try { await navigator.share({ title: name, text: `${name} on Watchd`, url }); closeSheet(); } catch (e) {} return; }
    try { await navigator.clipboard.writeText(url); closeSheet(); toast('Link copied'); } catch (e) { $('#sh-err').textContent = "Couldn't copy the link. Try again."; }
  },
  exportmine(d) { exportList(listName(), myRows(U.shareSel), d.v); },
  exportshared(d) { const v = U.shared; exportList(v.name, v.entries.map(e => { const m = metaFor(e.type, e.id); return m && { type: e.type, id: e.id, title: m.title, year: m.year, poster: m.poster, status: e.status }; }).filter(Boolean), d.v); },
  saveall() {
    let n = 0; for (const e of U.shared.entries) { const m = metaFor(e.type, e.id); if (m && !get(e.type, e.id)) { add(m, 'planning', true); n++; } }

  },
};

/* ===== Events ===== */
document.addEventListener('click', e => {
  if (e.target.classList?.contains('scrim')) return closeSheet();
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const f = A[b.dataset.a]; if (f) f(b.dataset, b, e);
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'q') onSearch(e.target.value);
  else if (id === 'ask-in') U.draft = e.target.value;
  else if (id === 'lq') { U.lq = e.target.value; const el = $('#liblist'); if (el) el.innerHTML = libList(); }
  else if (id === 'w-name') $('#w-err').textContent = '';
  else if (id === 'nm') $('#nm-err').textContent = '';
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') return closeSheet();
  if (e.key !== 'Enter') return;
  const id = e.target.id;
  if (id === 'ask-in') { e.preventDefault(); send(e.target.value); }
  else if (id === 'w-name') A.start();
  else if (id === 'nm') A.savename();
  else if (id === 'q') e.target.blur();
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'importcsv') { const files = [...el.files]; el.value = ''; if (files.length) importCSV(files); return; }
  if (el.id === 'lsort') { U.filter.o = el.value; const l = $('#liblist'); if (l) l.innerHTML = libList(); return; }
  if (el.id === 'region') { S.region = el.value; persist(); toast(`Showing services for ${countryName(region())}`); return; }
  if (!['restore', 'importlist'].includes(el.id) || !el.files[0]) return;
  let j; try { j = JSON.parse(await el.files[0].text()); } catch (err) { j = null; }
  el.value = '';
  if (el.id === 'restore') {
    if (!(j && j.app === 'watchd' && j.kind === 'backup' && j.data && typeof j.data.items === 'object')) return toast("That file isn't a Watchd backup. Choose a watchd-backup .json file.");
    const n = Object.values(j.data.items).filter(x => !x.deleted).length;
    confirmSheet('Restore this backup?', `It has ${n} title${n === 1 ? '' : 's'}${j.savedAt ? ` from ${fDate(j.savedAt)}` : ''}. Your current library will be replaced.`, 'Restore backup', () => {
      S = Object.assign(blank(), { name: j.data.name || S.name, theme: j.data.theme || 'auto', items: j.data.items, chat: Array.isArray(j.data.chat) ? j.data.chat : [], signedIn: S.signedIn, tips: S.tips });
      applyTheme(S.theme); persist(); go('settings'); toast('Backup restored');
    });
  } else {
    if (!(j && j.app === 'watchd' && j.kind === 'list' && Array.isArray(j.items))) return toast("That file isn't a Watchd list. Choose a .json list exported from Watchd.");
    const entries = j.items.filter(r => (r.type === 'movie' || r.type === 'tv') && Number.isInteger(+r.id)).slice(0, 500)
      .map(r => ({ type: r.type, id: +r.id, status: ST[r.status] ? r.status : 'planning', title: String(r.title || ''), year: String(r.year || ''), poster: r.poster || null }));
    if (!entries.length) return toast('That list is empty.');
    openShared({ name: String(j.name || 'Imported list').slice(0, 80), by: String(j.by || '').slice(0, 40), entries });
  }
});
addEventListener('hashchange', () => { const p = parseShareHash(); if (p) { if (S.name) openShared(p); else U.pending = p; } });

/* ===== Start ===== */
applyTheme(S.theme);
U.pending = parseShareHash();
if (S.name && U.pending) { const p = U.pending; U.pending = null; openShared(p); } else render();
if (FB.apiKey && (S.signedIn || authPending())) { if (authPending()) U.signing = true; loadFB().catch(() => {}); }
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
